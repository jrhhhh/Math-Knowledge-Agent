groups:
  - name: math-agent
    rules:
      - alert: MathAgentLowSuccessRate
        expr: math_agent_requests_total > 5 and math_agent_success_ratio < 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Math Agent 成功率过低
      - alert: MathAgentSlowRequests
        expr: rate(math_agent_slow_requests_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Math Agent 出现慢请求
      - alert: MathAgentRetryQueueBacklog
        expr: sum(math_agent_retry_queue_jobs{status=~"queued|running|retrying"}) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Math Agent 重试队列堆积
      - alert: MathAgentBackupFailed
        expr: increase(math_agent_backups_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Math Agent 数据库备份失败
      - alert: MathAgentBackupStale
        expr: math_agent_last_backup_timestamp == 0 or time() - math_agent_last_backup_timestamp > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Math Agent 超过 24 小时未完成备份
