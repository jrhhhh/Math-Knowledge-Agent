services:
  backend:
    build: ./backend
    environment:
      MATH_AGENT_ADMIN_KEY: ${MATH_AGENT_ADMIN_KEY:-}
      MATH_AGENT_LOG_LEVEL: ${MATH_AGENT_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/math_agent.db:/app/math_agent.db
  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
